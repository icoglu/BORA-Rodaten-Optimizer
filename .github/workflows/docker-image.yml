name: Docker-Image

on:
  push:
    branches: [main, "claude/docker-gui-data-collection-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bora-rodaten-optimizer

jobs:
  test:
    name: Tests im Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test-Stufe bauen (führt pytest aus)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: "docker compose up (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # wie Mac mit Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Exakt der Anwender-Befehl
        run: docker compose up -d --build
      - name: Warten auf healthy und GUI prüfen
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' bora-rodaten-optimizer)
            [ "$s" = healthy ] && break; sleep 2
          done
          docker compose ps
          docker compose logs --tail 30
          test "$s" = healthy
          curl -fsS http://localhost:8088/ | grep -q "BORA Rohdaten-Optimizer"
          echo "GUI unter http://localhost:8088/ erreichbar ($(uname -m))"

  publish:
    name: Image veröffentlichen
    needs: [test, compose-smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      - name: Laufzeit-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # amd64: Server/Windows, arm64: Mac mit Apple Silicon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Offline-Archiv erzeugen (docker save)
        run: |
          docker pull --platform linux/amd64 "${IMAGE}:latest"
          docker tag "${IMAGE}:latest" bora-rodaten-optimizer:latest
          docker save "${IMAGE}:latest" bora-rodaten-optimizer:latest | gzip -6 > bora-rodaten-optimizer-image.tar.gz
          sha256sum bora-rodaten-optimizer-image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bora-rodaten-optimizer-image
          path: |
            bora-rodaten-optimizer-image.tar.gz
            SHA256SUMS
          retention-days: 30
