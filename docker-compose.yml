services:
  bora-optimizer:
    build:
      context: .
      args:
        # Optional aus .env: interne Registry / pip-Mirror / Proxy
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: bora-rodaten-optimizer:latest
    container_name: bora-rodaten-optimizer
    restart: unless-stopped
    ports:
      # Host-Port über BORA_PORT (Datei .env) änderbar, Standard 8088
      - "${BORA_PORT:-8088}:8088"
    environment:
      TZ: Europe/Berlin
      BORA_ZIP_PREFIX: BORA
      # Read-only gemountete Quellverzeichnisse (":"-getrennt), zusätzlich zum Upload
      BORA_SOURCE_DIRS: /sources/logs
      # Optionale Basic-Auth - beide Werte setzen, um sie zu aktivieren
      BORA_USER: ${BORA_USER:-}
      BORA_PASSWORD: ${BORA_PASSWORD:-}
    volumes:
      - bora-data:/data
      - ./sources:/sources/logs:ro

volumes:
  bora-data:
