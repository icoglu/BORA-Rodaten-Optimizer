# BORA Rohdaten-Optimizer - Betrieb ausschließlich mit Docker
#
#   docker compose up -d                          # bauen und starten → http://localhost:8088
#   docker compose logs -f                        # Start-Diagnose und Protokoll
#
#   Linux-Server, automatisch freier Port (nie 8080/8090):
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#   docker compose --profile test run --rm tests  # Tests im Container
#   docker compose down                           # stoppen (Daten bleiben im Volume)

x-build-args: &build-args
  # Optional aus .env: interne Registry / pip-Mirror / Proxy
  BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
  PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

services:
  bora-optimizer:
    # Wird immer lokal gebaut (schnell dank Cache) - kein Registry-Login nötig.
    # Fertiges Registry-Image stattdessen: siehe README, "docker run ... ghcr.io/..."
    image: bora-rodaten-optimizer:latest
    pull_policy: build
    build:
      context: .
      target: runtime
      args: *build-args
    container_name: bora-rodaten-optimizer
    restart: unless-stopped
    # Port-Mapping - funktioniert auf Mac, Windows und Linux: http://localhost:8088
    # Anderer Port: BORA_PORT in .env (8090 ist für BORA reserviert - nicht verwenden!)
    # Linux-Server mit automatischer Port-Suche: siehe docker-compose.host.yml
    ports:
      - "${BORA_PORT:-8088}:8088"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BORA_ZIP_PREFIX: ${BORA_ZIP_PREFIX:-BORA}
      BORA_SOURCE_DIRS: /sources/logs
      BORA_MAX_UPLOAD_MB: ${BORA_MAX_UPLOAD_MB:-0}
      # Optionale Basic-Auth - beide Werte setzen, um sie zu aktivieren
      BORA_USER: ${BORA_USER:-}
      BORA_PASSWORD: ${BORA_PASSWORD:-}
    volumes:
      - bora-data:/data
      # Log-Verzeichnis des Hosts, read-only eingebunden (BORA_LOG_DIR in .env)
      - ${BORA_LOG_DIR:-./sources}:/sources/logs:ro

  tests:
    profiles: ["test"]
    image: bora-rodaten-optimizer:test
    build:
      context: .
      target: test
      args: *build-args
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  bora-data:
